<div class="tab-nav">

</div>

<div id="wordList"></div>

</div>

<div id="t2" class="tab-content">

<div class="mode-switch">

<button id="cMode-choice" class="active" onclick="setConceptMode('choice')">🔘 4지선다 고르기</button>

<button id="cMode-type" onclick="setConceptMode('type')">⌨️ 직접 타자 입력</button>

</div>

<div class="filter-box">

<span>연습 범위 선택:</span>

<select id="conceptFilter" class="mode-select" onchange="nextConcept()">

<option value="all">전체 문법 규칙</option>

<option value="te">て형 변환 규칙만</option>

<option value="nai">ない형 변환 규칙만</option>

<option value="masu">ます형 변환 규칙만</option>

</select>

</div>

<div id="conceptBadge" class="quiz-badge"></div>

<div id="conceptQ" class="quiz-prompt"></div>


<!-- 객관식 영역 -->

<div id="conceptChoiceBox"></div>

</div>


<div id="conceptFeedback" class="feedback-box"></div>

<button class="btn btn-next" onclick="nextConcept()">다음 개념 문제 ➔</button>

</div>

<div id="quizFeedback" class="feedback-box"></div>

<button class="btn btn-next" onclick="nextQuiz()">다음 동사 문제 ➔</button>

function bindCanvas(canvasEl, contextEl, getFlag, setFlag) {

const getPos = (e) => {

const rect = canvasEl.getBoundingClientRect();

const cx = e.touches ? e.touches[0].clientX : e.clientX;

const cy = e.touches ? e.touches[0].clientY : e.clientY;

return { x: cx - rect.left, y: cy - rect.top };

};

canvasEl.addEventListener('touchstart', e => { e.preventDefault(); setFlag(true); const p = getPos(e); contextEl.beginPath(); contextEl.moveTo(p.x, p.y); }, {passive: false});

canvasEl.addEventListener('touchmove', e => { e.preventDefault(); if(!getFlag()) return; const p = getPos(e); contextEl.lineTo(p.x, p.y); contextEl.stroke(); }, {passive: false});

canvasEl.addEventListener('touchend', () => setFlag(false));

canvasEl.addEventListener('mousedown', e => { setFlag(true); const p = getPos(e); contextEl.beginPath(); contextEl.moveTo(p.x, p.y); });

canvasEl.addEventListener('mousemove', e => { if(!getFlag()) return; const p = getPos(e); contextEl.lineTo(p.x, p.y); contextEl.stroke(); });

canvasEl.addEventListener('mouseup', () => setFlag(false));

}

function renderWordList() {

const countEl = document.getElementById('wordCount');

const starOnly = document.getElementById('starOnly').checked;

listEl.innerHTML = '';


const filtered = starOnly ? words.filter(w => w.starred) : words;

countEl.innerText = filtered.length;


if (filtered.length === 0) {

listEl.innerHTML = '<div style="text-align:center; color:#888; padding:20px;">⭐ 마크 표시된 단어가 없습니다.</div>';

return;

}


filtered.forEach(w => {

const isExc = w.group.includes('예외');

listEl.innerHTML += <div class="card"&gt; &lt;div style="flex:1;"&gt; &lt;div&gt;&lt;b&gt;${w.kanji}</b> (${w.hira}) &lt;span class="group-tag ${isExc ? 'exc' : ''}">${w.group}&lt;/span&gt; - ${w.mean}</div>

<div class="conj-row">ます: <b>${w.masu}&lt;/b&gt; · て: &lt;b&gt;${w.te}</b> · ない: <b>${w.nai}&lt;/b&gt;&lt;/div&gt; &lt;/div&gt; &lt;button class="star-btn ${w.starred ? 'starred' : ''}" onclick="toggleStar(${w.id})"&gt;★&lt;/button&gt; &lt;/div>;

});

}


function toggleStar(id) {

const w = words.find(x => x.id === id);

if (w) { w.starred = !w.starred; saveWords(); renderWordList(); }

}

function checkConceptTyping() {

const val = document.getElementById('conceptInput').value.trim().replace(/\s+/g, '');

if (!val) return;

const cleanAns = curConcept.ans.replace(/(.*?)/g, '').replace(/\s+/g, '');

const isOk = (val === curConcept.ans.replace(/\s+/g, '')) || (val === cleanAns);

showConceptResult(isOk);

}


function showConceptResult(isOk) {

const fb = document.getElementById('conceptFeedback');

fb.style.display = 'block';

fb.className = 'feedback-box ' + (isOk ? 'feedback-ok' : 'feedback-no');

fb.innerHTML = (isOk ? '⭕ 정답입니다!' : ❌ 오답! 정답: ${curConcept.ans}) +<br><span style="font-weight:normal; font-size:0.85rem;">${curConcept.desc}&lt;/span>;

}
